<svg xmlns="http://www.w3.org/2000/svg" width="382" height="222" viewBox="176 76 382 222" role="img" xmlns:c2pa="http://c2pa.org/manifest">
<title>Produit scalaire avec U : A, B et D sur le cercle, C en dehors</title>
<desc>Un cercle de rayon 1 avec le point U à droite. A, à 30 degrés de U, a un produit scalaire de 0,87. B, à 120 degrés, a moins 0,5. D, à l'opposé de U, a moins 1. C est dans la direction de A mais 1,6 fois plus loin du centre : 1,39. Les pointillés montrent l'ombre de chaque point sur l'axe horizontal.</desc>
<style>
text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #2C2C2A; }
.th { font-size: 14px; font-weight: 500; }
</style>
<rect x="176" y="76" width="382" height="222" fill="#ffffff"/>

<line x1="190" y1="190" x2="540" y2="190" stroke="#B4B2A9" stroke-width="0.5"/>
<circle cx="340" cy="190" r="100" fill="none" stroke="#888780" stroke-width="1"/>

<line x1="426.6" y1="140" x2="426.6" y2="190" stroke="#1D9E75" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="478.6" y1="110" x2="478.6" y2="190" stroke="#1D9E75" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="290" y1="103.4" x2="290" y2="190" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 3"/>

<line x1="340" y1="190" x2="440" y2="190" stroke="#7F77DD" stroke-width="2"/>
<line x1="340" y1="190" x2="240" y2="190" stroke="#D85A30" stroke-width="2"/>
<line x1="340" y1="190" x2="478.6" y2="110" stroke="#1D9E75" stroke-width="2"/>
<line x1="340" y1="190" x2="290" y2="103.4" stroke="#D85A30" stroke-width="2"/>

<circle cx="426.6" cy="190" r="3" fill="#1D9E75"/>
<circle cx="478.6" cy="190" r="3" fill="#1D9E75"/>
<circle cx="290" cy="190" r="3" fill="#D85A30"/>

<circle cx="440" cy="190" r="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<circle cx="240" cy="190" r="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<circle cx="426.6" cy="140" r="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<circle cx="478.6" cy="110" r="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<circle cx="290" cy="103.4" r="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>

<text class="th" x="450" y="212" dominant-baseline="central">U</text>
<text class="th" x="230" y="210" text-anchor="end" dominant-baseline="central">D : −1</text>
<text class="th" x="437" y="156" dominant-baseline="central">A : 0,87</text>
<text class="th" x="490" y="100" dominant-baseline="central">C : 1,39</text>
<text class="th" x="282" y="92" text-anchor="end" dominant-baseline="central">B : −0,5</text>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
